name: "CI: Build"

on:
    push:
        branches: [ "main", "master" ]
    pull_request:
        branches: [ "main", "master" ]

jobs:
    build:
        name: "${{ matrix.os }} | Release"
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      preset: x64-Release
                      editor: SuntaEditor.exe
                    - os: ubuntu-latest
                      preset: linux-release
                      editor: SuntaEditor
                    - os: macos-latest
                      preset: macos-release
                      editor: SuntaEditor

        steps:
            - name: "Setup: Fetch Sources & Submodules"
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: "Windows: Load the MSVC compiler environment"
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: "Linux: Install Dependencies"
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxcursor-dev libxinerama-dev \
                                   libxrandr-dev libxi-dev libgl1-mesa-dev \
                                   libglu1-mesa-dev mesa-common-dev \
                                   libwayland-dev wayland-protocols libxkbcommon-dev

            - name: "macOS: Install Dependencies"
              if: runner.os == 'macOS'
              run: brew install ninja

            - name: "Configuration: CMake Generate"
              run: cmake --preset ${{ matrix.preset }}

            - name: "Compilation: Build Editor & Runtime"
              run: cmake --build --preset ${{ matrix.preset }}

            - name: "Game: Build the sample project (MyGame)"
              shell: bash
              run: ./bin/Release-*/${{ matrix.editor }} --build-game Projects/MyGame

            # Zip files keep no "executable" flag, a tar archive does, so Linux and macOS players can just start the game
            - name: "Game: Pack for Linux and macOS"
              if: runner.os != 'Windows'
              shell: bash
              run: tar -czf MyGame-${{ matrix.os }}.tar.gz -C Projects/MyGame/Build .

            - name: "Distribution: Upload the game (Linux, macOS)"
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: MyGame-${{ matrix.os }}
                  path: MyGame-${{ matrix.os }}.tar.gz
                  if-no-files-found: error
                  retention-days: 5

            - name: "Distribution: Upload the game (Windows)"
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: MyGame-${{ matrix.os }}
                  path: Projects/MyGame/Build/
                  if-no-files-found: error
                  retention-days: 5

            - name: "Distribution: Upload Build Artifacts"
              uses: actions/upload-artifact@v4
              with:
                  name: Sunta-Engine-${{ matrix.os }}-Release
                  path: |
                      bin/Release-*/SuntaEditor*
                      bin/Release-*/SuntaRuntime*
                  if-no-files-found: error
                  retention-days: 5
