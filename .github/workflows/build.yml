name: "CI: Platform Validation"

# Defines when action happens 
on:
    push:
        branches: [ "main", "master" ]
    pull_request:
        branches: [ "main", "master" ]

jobs:
    build: 
        name: "${{ matrix.os }} | x64 Debug"
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
              os: [ windows-latest, ubuntu-latest, macos-latest ] 

        steps:
            - name: "Setup: Fetch Sources & Submodules"
              uses: actions/checkout@v4
              with:
                submodules: recursive # for .gitmodules if added in future
                    
            - name: "Linux: Install Dependencies"
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y libgtk-3-dev libx11-dev libxcursor-dev libxinerama-dev \
                                 libxrandr-dev libxi-dev libgl1-mesa-dev \
                                 libglu1-mesa-dev mesa-common-dev \
                                 libwayland-dev wayland-protocols libxkbcommon-dev

            - name: "Configuration: CMake Generate"
              run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSUNTA_DEV_MODE=OFF

            - name: "Compilation: Build Engine & Executables"
              run: cmake --build build --config Debug

            - name: "Distribution: Upload Build Artifacts"
              uses: actions/upload-artifact@v4
              with: 
                name: Sunta-Engine-${{ matrix.os }}-x64-Debug
                path: |
                  bin/**/Game* # Game, Game.exe, Game.pdb, Linux and Mac just uses Game without .exe
                  bin/**/res/
                if-no-files-found: error
                retention-days: 5